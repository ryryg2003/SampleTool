name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, end-to-end and Windows/NTFS tests
        run: python tests/run_all.py
      - name: Large library (5,000 files)
        env:
          SLO_E2E_LARGE: "5000"
        run: python -m unittest -v tests.test_e2e.LargeScanTest
      - name: Bundled Python runs the whole test suite
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          & .\python\python.exe tests\run_all.py
          exit $LASTEXITCODE
      - name: Launcher starts the app on a PC with no Python on PATH
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          $env:Path = "C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:pythonLocation, Env:Python_ROOT_DIR, Env:Python3_ROOT_DIR, Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "lad"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "launcher.txt"
          $p = Start-Process cmd.exe -ArgumentList '/c', 'call "Launch Sample Organizer.bat" --no-browser --port 8797' -PassThru -NoNewWindow -RedirectStandardOutput $log
          $s = $null
          for ($i = 0; $i -lt 60 -and -not $s; $i++) {
            try { $s = Invoke-RestMethod http://127.0.0.1:8797/api/settings } catch { Start-Sleep 1 }
          }
          Get-Content $log
          Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$PWD\python\*" } | Stop-Process -Force
          $p | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $s) { throw "The launcher did not start the app" }
          $s.info.python | ConvertTo-Json
          if (-not $s.info.python.bundled) { throw "The app did not run on the bundled Python" }
          if ($s.settings.root) { throw "A first run must not preset a collection folder: $($s.settings.root)" }

  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright (test tooling only; the app itself needs no Node)
        run: |
          npm init -y
          npm install playwright@1.48.2
          npx playwright install chromium
      - name: UI smoke in fixture mode
        shell: bash
        run: |
          python -m samplelib --root "$RUNNER_TEMP/empty" --data-dir "$RUNNER_TEMP/data" --port 8799 --no-browser &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8799/api/state && break; sleep 1; done
          node tests/ui_smoke.js "http://127.0.0.1:8799/?fixture=1" "$RUNNER_TEMP/shots-fixture"
      - name: Full producer flow through the UI (disposable fixture)
        shell: bash
        run: node tests/ui_flow.js "$RUNNER_TEMP/shots-flow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/shots-*
